services:
  api:
    build: .
    container_name: codearena_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/code/app
    depends_on:
      - mysql
      - mongo
    restart: unless-stopped
    networks:
      - codearena_network

  mysql:
    image: mysql:8.0
    container_name: codearena_mysql
    environment:
      MYSQL_ROOT_PASSWORD: codearena_pass
      MYSQL_DATABASE: codearena
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - codearena_network

  mongo:
    image: mongo:7.0
    container_name: codearena_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - codearena_network

  frontend:
    image: nginx:alpine
    container_name: codearena_frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - codearena_network

volumes:
  mysql_data:
  mongo_data:

networks:
  codearena_network:
    driver: bridge